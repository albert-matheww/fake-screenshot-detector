server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Reverse-proxy API calls to the backend container so the frontend can
    # always call same-origin "/api/..." regardless of deployment host.
    # This only applies under docker-compose, where "backend" is a real
    # service name on the shared network. On platforms that build this
    # image standalone (e.g. Render, via VITE_API_HOST) nothing ever hits
    # this location, but nginx still resolves proxy_pass targets at
    # startup by default — using a variable defers that to request time
    # via Docker's embedded resolver, so nginx boots either way instead
    # of crashing when "backend" doesn't exist.
    resolver 127.0.0.11 valid=30s;
    location /api/ {
        set $backend_upstream backend;
        # proxy_pass with a variable upstream disables nginx's normal
        # prefix-stripping, so /api/ has to be stripped explicitly here
        # (proxy_pass below has no trailing URI — it forwards this
        # rewritten $uri as-is).
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 12M;
    }
}
