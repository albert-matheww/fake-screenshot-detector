services:
  backend:
    build: ./backend
    container_name: fsd-backend
    ports:
      - "5050:5000"
    environment:
      - CORS_ORIGINS=*
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: fsd-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
