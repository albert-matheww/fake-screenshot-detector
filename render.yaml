# Render Blueprint — deploys both services from their existing Dockerfiles
# in one shot: in the Render dashboard, New > Blueprint > connect this repo.
# Render auto-detects this file and provisions both services below.
#
# The frontend needs the backend's public URL baked in at build time (see
# frontend/src/services/api.js for why: Vite inlines env vars at build
# time, not container start). This was originally wired via a
# cross-service reference (fromService, property: host) so it would stay
# correct even if Render assigned a different subdomain — but that was
# verified (by inspecting the built bundle after a real deploy) to
# return the backend's bare private-network service name, not its public
# onrender.com hostname, which produced an unreachable "https://
# fake-screenshot-detector-backend" with no domain. Hardcoded below
# instead, confirmed live at deploy time.
services:
  - type: web
    name: fake-screenshot-detector-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ELA_QUALITY
        value: "90"
      - key: FAKE_THRESHOLD
        value: "0.5"
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: fake-screenshot-detector-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fake-screenshot-detector-backend.onrender.com
