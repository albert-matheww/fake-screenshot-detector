# Render Blueprint — deploys both services from their existing Dockerfiles
# in one shot: in the Render dashboard, New > Blueprint > connect this repo.
# Render auto-detects this file and provisions both services below.
#
# The frontend's VITE_API_HOST is wired to the backend service via a
# cross-service reference (fromService) rather than hardcoded, so it stays
# correct even if Render assigns a different subdomain than expected.
# frontend/src/services/api.js builds the full https:// origin from that
# bare hostname at build time (see that file for why: Vite bakes env vars
# into the bundle at build time, not container start).
services:
  - type: web
    name: fake-screenshot-detector-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ELA_QUALITY
        value: "90"
      - key: FAKE_THRESHOLD
        value: "0.5"
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: fake-screenshot-detector-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: fake-screenshot-detector-backend
          property: host
